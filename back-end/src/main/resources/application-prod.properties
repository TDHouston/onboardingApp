# Railway Production Configuration
# Use Railway's provided DATABASE_URL
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Server configuration
server.port=${PORT:8080}

# CORS Configuration for Production
cors.allowed.origins=${CORS_ORIGINS:https://onboarding-app-ashy.vercel.app}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
frontend.url=${FRONTEND_URL:https://onboarding-app-ashy.vercel.app}